[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-matching"
version = "0.1.0"
description = "Match and score resumes against a job description: skills (with aliases and implications), experience, education and semantic similarity."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["resume", "cv", "job description", "matching", "screening", "ats", "skills"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
files = ["pypdf>=4.0", "python-docx>=1.1"]
spacy = ["spacy>=3.7"]
dev = ["pytest>=8", "pypdf>=4.0", "python-docx>=1.1", "reportlab>=4"]

[project.scripts]
resume-match = "resume_matching.cli:main"

[project.urls]
Homepage = "https://github.com/ChargingTrex/resume-matching-"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
